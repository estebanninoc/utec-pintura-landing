<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="c" width="1536" height="1024"></canvas>
<script>
var NAMES=['Golpes','Latonería','Masilla','Masilla lijada','Primer','Pintura base','Clear coat'];
/* ?set=taller (fondo taller) | ?set=negro (fondo negro) */
var SET=new URLSearchParams(location.search).get('set')||'taller';
/* PT7: fotos 3:1 (2172x724). ?layout=desk -> carro a lo ancho del lienzo (frames.sh despiece recorta 1280x732 al centro,
   no lo corta). ?layout=mob -> carro dentro de la columna central que sobrevive al recorte vertical de frames.sh motor-mini
   (scale-to-cover 1536x1024 -> 1054x703, crop 403 al centro = x 474..1061 del lienzo), así el carro entra ENTERO. */
var LAYOUT=new URLSearchParams(location.search).get('layout')||'desk';
var RECT=null, CHIP_Y=118;
/* PT8 (?modo=continuo, por defecto): como el despiece de motos -> SIN holds, SIN chips/puntos, 6 transiciones repartidas
   parejo en los N cuadros (cuadro 1 = Golpes, cuadro N = Clear coat), borde de barrido MUY ancho (65% del ancho) */
var MODO=new URLSearchParams(location.search).get('modo')||'continuo';
var FEATHER = MODO==='continuo' ? 0.65 : 0.18;
var FILES=['1-golpes','2-latoneria','3-masilla','4-masilla-lijada','5-primer','6-pintura-mate','7-final'];
var W=1536,H=1024, imgs=[], RED='#C8102E';
/* linea de tiempo en "unidades": hold inicial largo, 6 transiciones, holds medios, hold final largo */
var HOLD0=1.4, TR=1.0, HOLD=0.7, HOLDN=1.6, TOTAL=HOLD0+6*TR+5*HOLD+HOLDN;
function ease(t){return t*t*(3-2*t);}
function at(u){ /* -> {a: etapa origen, b: etapa destino, t: 0..1} */
  if(u<=HOLD0) return {a:0,b:0,t:0};
  u-=HOLD0;
  for(var k=0;k<6;k++){
    if(u<=TR) return {a:k,b:k+1,t:ease(u/TR)};
    u-=TR;
    if(k<5){ if(u<=HOLD) return {a:k+1,b:k+1,t:0}; u-=HOLD; }
  }
  return {a:6,b:6,t:0};
}
var off=document.createElement('canvas'); off.width=W; off.height=H; var ox=off.getContext('2d');
function wipe(ctx,A,B,t){
  /* PT7: barrido HORIZONTAL de izquierda a derecha (trompa -> puerta), borde suave, sin neblina ni efecto de pistola */
  var R=RECT; ctx.globalAlpha=1; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(A,R.sx,R.sy,R.sw,R.sh,R.x,R.y,R.w,R.h);
  if(t<=0) return; if(t>=1){ ctx.drawImage(B,R.sx,R.sy,R.sw,R.sh,R.x,R.y,R.w,R.h); return; }
  var FE=R.w*FEATHER, pos=R.x-FE/2+t*(R.w+FE);
  ox.clearRect(0,0,W,H); ox.globalCompositeOperation='source-over'; ox.drawImage(B,R.sx,R.sy,R.sw,R.sh,R.x,R.y,R.w,R.h);
  ox.globalCompositeOperation='destination-in';
  var g=ox.createLinearGradient(pos-FE/2,0,pos+FE/2,0); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ox.fillStyle=g; ox.fillRect(0,0,W,H); ox.globalCompositeOperation='source-over';
  ctx.drawImage(off,0,0);
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function chip(ctx,s,alpha,dotPos){
  var cx=W/2, cy=CHIP_Y, fs=40;
  ctx.font='800 '+fs+'px "Inter Tight"';
  var label=NAMES[s], nw=ctx.measureText(label).width;
  var badge=58, padL=14, gap=16, padR=30, w=Math.ceil(padL+badge+gap+nw+padR), h=78;
  var x=cx-w/2, y=cy-h/2;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=24;
  rr(ctx,x,y,w,h,h/2); ctx.fillStyle='rgba(8,8,10,.72)'; ctx.fill(); ctx.restore();
  rr(ctx,x,y,w,h,h/2); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.stroke();
  ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.arc(x+padL+badge/2,cy,badge/2,0,Math.PI*2); ctx.fillStyle=RED; ctx.fill();
  ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.font='900 30px "Inter Tight"'; ctx.fillText(String(s+1),x+padL+badge/2,cy+1);
  ctx.textAlign='left'; ctx.font='800 '+fs+'px "Inter Tight"'; ctx.fillText(label,x+padL+badge+gap,cy+2);
  ctx.globalAlpha=1;
  /* 7 puntos de avance bajo el chip */
  var dy=cy+h/2+28, sp=32;
  for(var i=0;i<7;i++){
    var px=cx+(i-3)*sp, on=Math.max(0,Math.min(1,dotPos-i));
    ctx.beginPath(); ctx.arc(px,dy,9,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
    if(on>0){ ctx.globalAlpha=on; ctx.beginPath(); ctx.arc(px,dy,9,0,Math.PI*2); ctx.fillStyle=RED; ctx.fill(); ctx.globalAlpha=1; }
  }
}
/* variante negro: el fondo de las fotos es casi negro (~5,5,5), no #000. Se aplastan los negros
   (niveles: todo <=12 -> 0, resto reescalado) y se funden los bordes a negro puro, para que el
   canvas no deje caja visible sobre el fondo #000 de la página. */
function aNegro(ctx){
  var im=ctx.getImageData(0,0,W,H), d=im.data, LO=12, k=255/(255-LO);
  for(var i=0;i<d.length;i+=4){ for(var c=0;c<3;c++){ var v=d[i+c]-LO; d[i+c]=v<=0?0:Math.min(255,Math.round(v*k)); } }
  ctx.putImageData(im,0,0);
  function edge(x0,y0,x1,y1){ var g=ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  edge(0,0,0,H*0.07); edge(0,H,0,H*0.88); /* PT7: sin fundido lateral, el carro 3:1 llega cerca de los bordes */
  /* PT7: el reflejo del piso termina en el borde inferior de la foto: fundirlo a negro (15% inferior de la foto) */
  if(RECT){ var yb=RECT.y+RECT.h; edge(0,yb,0,yb-RECT.h*0.15); ctx.fillStyle='#000'; ctx.fillRect(0,yb,W,H-yb); }
}
function frame(k,N){
  var ctx=document.getElementById('c').getContext('2d');
  if(MODO==='continuo'){
    var u=(k-1)/(N-1)*6, a=Math.min(5,Math.floor(u)), t=ease(u-a);
    wipe(ctx,imgs[a],imgs[a+1],t);
    if(SET==='negro') aNegro(ctx);
    return document.getElementById('c').toDataURL('image/jpeg',0.95);
  }
  var u=(k-1)/(N-1)*TOTAL, s=at(u);
  wipe(ctx,imgs[s.a],imgs[s.b],s.t);
  if(SET==='negro') aNegro(ctx);
  var shown = s.t<0.5 ? s.a : s.b, alpha = s.a===s.b ? 1 : Math.abs(s.t-0.5)*2;
  chip(ctx,shown,Math.max(0.15,alpha), s.a+1+s.t);
  return document.getElementById('c').toDataURL('image/jpeg',0.95);
}
window.ready=(async function(){
  var f=new FontFace('Inter Tight','url(inter-tight.woff2)',{weight:'100 900'}); await f.load(); document.fonts.add(f);
  imgs=await Promise.all(FILES.map(function(n){return new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.src=SET+'/'+n+'.png';});}));
  /* caja del carro (unión de las 7, luma>28) + 3% de margen: recorta solo negro vacío, nunca el carro */
  var iw=imgs[0].naturalWidth, ih=imgs[0].naturalHeight, c=document.createElement('canvas'); c.width=iw; c.height=ih;
  var cx2=c.getContext('2d'), x0=iw, y0=ih, x1=0, y1=0;
  imgs.forEach(function(im){ cx2.drawImage(im,0,0); var d=cx2.getImageData(0,0,iw,ih).data;
    for(var y=0;y<ih;y+=2) for(var x=0;x<iw;x+=2){ var i=(y*iw+x)*4; if(0.3*d[i]+0.59*d[i+1]+0.11*d[i+2]>28){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } });
  var mx=Math.round((x1-x0)*0.03), my=Math.round((y1-y0)*0.03);
  x0=Math.max(0,x0-mx); x1=Math.min(iw,x1+mx); y0=Math.max(0,y0-my); y1=Math.min(ih,y1+my);
  var sw=x1-x0, sh=y1-y0, colX=474, colW=1061-474;
  var bw = LAYOUT==='mob' ? colW : W, bh=bw*sh/sw, bx = LAYOUT==='mob' ? colX : 0, by=(H-bh)/2 + (LAYOUT==='mob'?40:30);
  RECT={sx:x0,sy:y0,sw:sw,sh:sh,x:bx,y:by,w:bw,h:bh};
  CHIP_Y = Math.max(LAYOUT==='mob'?118:120, by-100);
  window.__rect=RECT;
  return true;
})();
</script></body></html>
