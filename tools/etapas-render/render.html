<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="c" width="1536" height="1024"></canvas>
<script>
var NAMES=['Latonería','Lijado','Pre-pintura','Pintura','Clear coat','Polish','Resultado final'];
/* ?set=taller (fondo taller) | ?set=negro (fondo negro) */
var SET=new URLSearchParams(location.search).get('set')||'taller';
var FILES=['1-latoneria','2-lijado','3-prepintura','4-pintura','5-clearcoat','6-polish','7-final'];
var W=1536,H=1024, imgs=[], RED='#C8102E';
/* linea de tiempo en "unidades": hold inicial largo, 6 transiciones, holds medios, hold final largo */
var HOLD0=1.4, TR=1.0, HOLD=0.7, HOLDN=1.6, TOTAL=HOLD0+6*TR+5*HOLD+HOLDN;
function ease(t){return t*t*(3-2*t);}
function at(u){ /* -> {a: etapa origen, b: etapa destino, t: 0..1} */
  if(u<=HOLD0) return {a:0,b:0,t:0};
  u-=HOLD0;
  for(var k=0;k<6;k++){
    if(u<=TR) return {a:k,b:k+1,t:ease(u/TR)};
    u-=TR;
    if(k<5){ if(u<=HOLD) return {a:k+1,b:k+1,t:0}; u-=HOLD; }
  }
  return {a:6,b:6,t:0};
}
var off=document.createElement('canvas'); off.width=W; off.height=H; var ox=off.getContext('2d');
function wipe(ctx,A,B,t){
  ctx.globalAlpha=1; ctx.drawImage(A,0,0,W,H);
  if(t<=0) return; if(t>=1){ ctx.drawImage(B,0,0,W,H); return; }
  /* pasada de pistola: barrido de arriba hacia abajo, levemente inclinado, borde suave */
  var ang=12*Math.PI/180, dx=Math.sin(ang), dy=Math.cos(ang);
  var L=W*Math.abs(dx)+H*dy, FE=H*0.26, pos=-FE+t*(L+2*FE);
  var x0=0, y0=0, x1=dx*L, y1=dy*L; if(dx<0){x0=W; x1=W+dx*L;}
  ox.clearRect(0,0,W,H); ox.globalCompositeOperation='source-over'; ox.drawImage(B,0,0,W,H);
  ox.globalCompositeOperation='destination-in';
  var g=ox.createLinearGradient(x0,y0,x1,y1);
  function st(p,a){ p=Math.max(0,Math.min(1,p/L)); g.addColorStop(p,'rgba(0,0,0,'+a+')'); }
  st(pos-FE/2,1); st(pos+FE/2,0);
  ox.fillStyle=g; ox.fillRect(0,0,W,H); ox.globalCompositeOperation='source-over';
  ctx.drawImage(off,0,0);
  /* neblina de la pasada sobre el borde */
  var m=ctx.createLinearGradient(x0,y0,x1,y1), a=0.16*Math.sin(Math.PI*t);
  function ms(p,al){ p=Math.max(0,Math.min(1,p/L)); m.addColorStop(p,'rgba(255,255,255,'+al+')'); }
  ms(pos-FE*0.55,0); ms(pos,a); ms(pos+FE*0.55,0);
  ctx.fillStyle=m; ctx.fillRect(0,0,W,H);
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function chip(ctx,s,alpha,dotPos){
  var cx=W/2, cy=118, fs=40;
  ctx.font='800 '+fs+'px "Inter Tight"';
  var label=NAMES[s], nw=ctx.measureText(label).width;
  var badge=58, padL=14, gap=16, padR=30, w=Math.ceil(padL+badge+gap+nw+padR), h=78;
  var x=cx-w/2, y=cy-h/2;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=24;
  rr(ctx,x,y,w,h,h/2); ctx.fillStyle='rgba(8,8,10,.72)'; ctx.fill(); ctx.restore();
  rr(ctx,x,y,w,h,h/2); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.stroke();
  ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.arc(x+padL+badge/2,cy,badge/2,0,Math.PI*2); ctx.fillStyle=RED; ctx.fill();
  ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.font='900 30px "Inter Tight"'; ctx.fillText(String(s+1),x+padL+badge/2,cy+1);
  ctx.textAlign='left'; ctx.font='800 '+fs+'px "Inter Tight"'; ctx.fillText(label,x+padL+badge+gap,cy+2);
  ctx.globalAlpha=1;
  /* 7 puntos de avance bajo el chip */
  var dy=cy+h/2+28, sp=32;
  for(var i=0;i<7;i++){
    var px=cx+(i-3)*sp, on=Math.max(0,Math.min(1,dotPos-i));
    ctx.beginPath(); ctx.arc(px,dy,9,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
    if(on>0){ ctx.globalAlpha=on; ctx.beginPath(); ctx.arc(px,dy,9,0,Math.PI*2); ctx.fillStyle=RED; ctx.fill(); ctx.globalAlpha=1; }
  }
}
/* variante negro: el fondo de las fotos es casi negro (~5,5,5), no #000. Se aplastan los negros
   (niveles: todo <=12 -> 0, resto reescalado) y se funden los bordes a negro puro, para que el
   canvas no deje caja visible sobre el fondo #000 de la página. */
function aNegro(ctx){
  var im=ctx.getImageData(0,0,W,H), d=im.data, LO=12, k=255/(255-LO);
  for(var i=0;i<d.length;i+=4){ for(var c=0;c<3;c++){ var v=d[i+c]-LO; d[i+c]=v<=0?0:Math.min(255,Math.round(v*k)); } }
  ctx.putImageData(im,0,0);
  function edge(x0,y0,x1,y1){ var g=ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  edge(0,0,0,H*0.07); edge(0,H,0,H*0.88); edge(0,0,W*0.035,0); edge(W,0,W*0.965,0);
}
function frame(k,N){
  var ctx=document.getElementById('c').getContext('2d');
  var u=(k-1)/(N-1)*TOTAL, s=at(u);
  wipe(ctx,imgs[s.a],imgs[s.b],s.t);
  if(SET==='negro') aNegro(ctx);
  var shown = s.t<0.5 ? s.a : s.b, alpha = s.a===s.b ? 1 : Math.abs(s.t-0.5)*2;
  chip(ctx,shown,Math.max(0.15,alpha), s.a+1+s.t);
  return document.getElementById('c').toDataURL('image/jpeg',0.95);
}
window.ready=(async function(){
  var f=new FontFace('Inter Tight','url(inter-tight.woff2)',{weight:'100 900'}); await f.load(); document.fonts.add(f);
  imgs=await Promise.all(FILES.map(function(n){return new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.src=SET+'/'+n+'.png';});}));
  return true;
})();
</script></body></html>
